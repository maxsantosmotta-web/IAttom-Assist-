name: ChatGPT MCP operational adapter tests
on:
  push:
    branches:
      - 'test/chatgpt-operational-adapter'
permissions:
  contents: read
jobs:
  isolated-mcp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/chatgpt-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/chatgpt-plugin/package-lock.json
      - run: npm ci
      - run: node --test iattom-client.test.js
      - run: node --check server-official.js
